<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>架空史图志 · 历史地图工坊</title>
<meta name="description" content="在浏览器里绘制架空历史地图：大陆、河流、地貌、森林、国家、行政区、城市、军队。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Alegreya:wght@700;800&family=Noto+Sans+SC:wght@400;600&family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&display=swap">
<link rel="stylesheet" href="css/style.css?v=39">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233e5f8a'/><path d='M6 22c3-9 8-12 13-10s6-3 8 0c0 8-6 13-12 13S7 26 6 22z' fill='%23e9dcbf' stroke='%231d3a63' stroke-width='1.5'/><path d='M14 14l4 3-3 5' fill='none' stroke='%23b8231a' stroke-width='1.6'/></svg>">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="seal">图</span><div><b>架空史图志</b><small>历史地图工坊</small></div></div>
  <input id="mapName" type="text" spellcheck="false" title="地图名称">
  <div class="tb">
    <button class="btn" id="btnNew">新建</button>
    <button class="btn" id="btnOpen">打开</button>
    <button class="btn" id="btnSave">保存</button>
    <button class="btn" id="btnPng">导出图片</button>
    <button class="btn fam" id="btnFamily">家族</button>
    <button class="btn" id="btnProfile" title="国家档案（I）">国家档案</button>
    <button class="btn" id="btnPower" title="国力排名（O）">国力排名</button>
    <span class="sep"></span>
    <button class="btn icon" id="btnUndo" title="撤销 Ctrl+Z">↶</button>
    <button class="btn icon" id="btnRedo" title="重做 Ctrl+Shift+Z">↷</button>
    <button class="btn icon" id="btnFit" title="全图">⤢</button>
    <button class="btn icon" id="btnHelp" title="帮助">?</button>
    <span id="saveState"></span>
  </div>
</header>
<div id="main">
  <nav id="tools"></nav>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="optbar"></div>
    <div id="status"></div>
    <div id="lvBtns"></div>
    <div id="keyHint">WASD 移动 · Q/E 缩放 · 1–0 切换工具 · I 国家档案 · O 国力 · <b>?</b> 全部快捷键</div>
    <div id="zoomBtns"><button class="btn icon" id="zIn" title="放大">＋</button><button class="btn icon" id="zOut" title="缩小">－</button></div>
    <button class="btn" id="panelToggle">面板</button>
  </div>
  <aside id="panel">
    <div id="selBox" class="card sel" hidden></div>
    <div id="tabs"><button data-tab="nations">国家</button><button data-tab="provs">行政区</button><button data-tab="layers">图层</button><button data-tab="map">地图</button></div>
    <div id="tabBody"></div>
  </aside>
</div>
<div id="modal" hidden></div>
<div id="busy" hidden></div>
<div id="toast"></div>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/util.js?v=39"></script>
<script src="js/state.js?v=39"></script>
<script src="js/geometry.js?v=39"></script>
<script src="js/sprites.js?v=39"></script>
<script src="js/sprites2.js?v=39"></script>
<script src="js/names.js?v=39"></script>
<script src="js/translit.js?v=39"></script>
<script src="js/climate.js?v=39"></script>
<script src="js/render.js?v=39"></script>
<script src="js/ops.js?v=39"></script>
<script src="js/admin.js?v=39"></script>
<script src="js/polity.js?v=39"></script>
<script src="js/placenames.js?v=39"></script>
<script src="js/tools.js?v=39"></script>
<script src="js/refine.js?v=39"></script>
<script src="js/generate.js?v=39"></script>
<script src="js/preset.js?v=39"></script>
<script src="js/templates.js?v=39"></script>
<script src="js/ui.js?v=39"></script>
<script src="js/nationui.js?v=39"></script>
<script src="js/multisel.js?v=39"></script>
<script src="js/family.js?v=39"></script>
<script src="js/main.js?v=39"></script>
</body>
</html>
